name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete — cancel it
# rather than paying for two runs of the same check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skip the whole matrix when only docs changed. Cheaper, and keeps the
  # required-check signal meaningful.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Install from the workspace root — the lockfile covers every package.
      - run: pnpm install --frozen-lockfile

      # Each gate runs even if an earlier one failed, so one CI run reports
      # every problem instead of only the first.
      - name: Typecheck
        run: pnpm --filter web run typecheck

      - name: Lint
        if: '!cancelled()'
        run: pnpm --filter web run lint

      - name: Format check
        if: '!cancelled()'
        run: pnpm --filter web run format:check

      - name: Unit tests
        if: '!cancelled()'
        run: pnpm --filter web run test

      - name: Build
        if: '!cancelled()'
        run: pnpm --filter web run build

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        if: '!cancelled()'
        run: uv run ruff format --check .

      - name: Tests
        if: '!cancelled()'
        run: uv run pytest
